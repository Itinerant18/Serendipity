<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Picture Upload Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
      }
      .section {
        margin: 20px 0;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      img {
        max-width: 200px;
        border-radius: 8px;
      }
      button {
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
      }
      button:hover {
        background: #45a049;
      }
      .error {
        color: red;
        padding: 10px;
        background: #ffebee;
        border-radius: 4px;
        margin: 10px 0;
      }
      .success {
        color: green;
        padding: 10px;
        background: #e8f5e9;
        border-radius: 4px;
        margin: 10px 0;
      }
      .log {
        background: #f5f5f5;
        padding: 10px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        max-height: 300px;
        overflow-y: auto;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>🔍 Profile Picture Upload Test</h1>

    <div class="section">
      <h3>Step 1: Check Authentication</h3>
      <div id="auth-status">Checking...</div>
      <button onclick="checkAuth()">Refresh Auth</button>
    </div>

    <div class="section">
      <h3>Step 2: Select Image</h3>
      <input
        type="file"
        id="fileInput"
        accept="image/*"
        onchange="handleFileSelect(event)"
      />
      <div id="file-info"></div>
      <div id="preview"></div>
    </div>

    <div class="section">
      <h3>Step 3: Upload</h3>
      <button id="uploadBtn" onclick="uploadImage()" disabled>
        Upload to Server
      </button>
      <div id="upload-result"></div>
    </div>

    <div class="section">
      <h3>Debug Log</h3>
      <button onclick="clearLog()">Clear Log</button>
      <div id="log" class="log"></div>
    </div>

    <script>
      const API_URL = "http://localhost:5000";
      let selectedFile = null;
      let token = null;

      function log(message, type = "info") {
        const logDiv = document.getElementById("log");
        const timestamp = new Date().toLocaleTimeString();
        const icon = type === "error" ? "❌" : type === "success" ? "✅" : "📝";
        logDiv.innerHTML += `[${timestamp}] ${icon} ${message}\n`;
        logDiv.scrollTop = logDiv.scrollHeight;
      }

      function clearLog() {
        document.getElementById("log").innerHTML = "";
      }

      async function checkAuth() {
        try {
          log("Checking authentication...");

          // Try to get token from localStorage
          token = localStorage.getItem("token");

          if (!token) {
            document.getElementById("auth-status").innerHTML =
              '<div class="error">❌ Not authenticated. Please <a href="/account/signin">sign in</a> first.</div>';
            log("No token found in localStorage", "error");
            return;
          }

          // Verify token with backend
          const response = await fetch(`${API_URL}/api/auth/me`, {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          if (response.ok) {
            const user = await response.json();
            document.getElementById(
              "auth-status",
            ).innerHTML = `<div class="success">✅ Authenticated as: ${
              user.email || user.name || "User"
            }</div>`;
            log(`Authenticated as: ${user.email}`, "success");
          } else {
            document.getElementById("auth-status").innerHTML =
              '<div class="error">❌ Invalid token. Please <a href="/account/signin">sign in</a> again.</div>';
            log("Token verification failed", "error");
            token = null;
          }
        } catch (error) {
          document.getElementById(
            "auth-status",
          ).innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
          log(`Auth error: ${error.message}`, "error");
        }
      }

      function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        selectedFile = file;

        log(`File selected: ${file.name}`);
        log(`Type: ${file.type}, Size: ${(file.size / 1024).toFixed(2)} KB`);

        // Validate file
        if (!file.type.startsWith("image/")) {
          document.getElementById("file-info").innerHTML =
            '<div class="error">❌ File must be an image</div>';
          log("Invalid file type", "error");
          document.getElementById("uploadBtn").disabled = true;
          return;
        }

        if (file.size > 5 * 1024 * 1024) {
          document.getElementById("file-info").innerHTML =
            '<div class="error">❌ File too large (max 5MB)</div>';
          log("File too large", "error");
          document.getElementById("uploadBtn").disabled = true;
          return;
        }

        document.getElementById(
          "file-info",
        ).innerHTML = `<div class="success">✅ File: ${file.name} (${(
          file.size / 1024
        ).toFixed(2)} KB)</div>`;

        // Show preview
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById(
            "preview",
          ).innerHTML = `<img src="${e.target.result}" alt="Preview">`;
          log("Preview generated", "success");
        };
        reader.readAsDataURL(file);

        document.getElementById("uploadBtn").disabled = !token;
      }

      async function uploadImage() {
        if (!selectedFile) {
          alert("Please select a file first");
          return;
        }

        if (!token) {
          alert("Please sign in first");
          return;
        }

        try {
          log("Starting upload...");
          document.getElementById("uploadBtn").disabled = true;
          document.getElementById("uploadBtn").textContent = "Uploading...";

          const formData = new FormData();
          formData.append("file", selectedFile);

          log(`Sending POST to ${API_URL}/api/upload/profile-image`);

          const response = await fetch(`${API_URL}/api/upload/profile-image`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
            },
            body: formData,
          });

          const data = await response.json();

          if (response.ok) {
            document.getElementById(
              "upload-result",
            ).innerHTML = `<div class="success">✅ Upload successful!<br>URL: <a href="${data.url}" target="_blank">${data.url}</a></div>
                         <img src="${data.url}" alt="Uploaded">`;
            log(`Upload successful: ${data.url}`, "success");
          } else {
            document.getElementById(
              "upload-result",
            ).innerHTML = `<div class="error">❌ Upload failed: ${
              data.message || "Unknown error"
            }</div>`;
            log(`Upload failed: ${JSON.stringify(data)}`, "error");
          }
        } catch (error) {
          document.getElementById(
            "upload-result",
          ).innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
          log(`Upload error: ${error.message}`, "error");
        } finally {
          document.getElementById("uploadBtn").disabled = false;
          document.getElementById("uploadBtn").textContent = "Upload to Server";
        }
      }

      // Check auth on page load
      checkAuth();
    </script>
  </body>
</html>
