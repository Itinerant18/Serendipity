[build]
builder = "nixpacks"
buildCommand = "npm run build"

[build.nixpacksPlan]
installCommand = "npm ci --legacy-peer-deps"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[build.environment]
NODE_ENV = "production"
