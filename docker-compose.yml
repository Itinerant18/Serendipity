# Docker Compose - Development & Production Stack
# Usage: docker-compose up --build

services:
  # Frontend - React Router Application
  frontend:
    build:
      context: ./frontend/apps/web
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - VITE_API_URL=http://backend:5000
      - VITE_SOCKET_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - serendipity-network

  # Backend - Express API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CORS_ORIGINS=http://localhost:4000,http://frontend:4000
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - serendipity-network

networks:
  serendipity-network:
    driver: bridge
